name: Flutter APK Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release 版本'
        required: true
        type: string
        default: '1.0.0'
      release_notes:
        description: 'Release 更新'
        required: false
        type: string
        default: '更新应用图标与配置'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 设置 Java
      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. 设置 Flutter
      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # 4. 获取依赖
      - name: 获取 Flutter 依赖
        run: flutter pub get

      # 5. 编译 APK
      - name: 编译 APK
        run: |
          flutter clean
          flutter build apk --release --split-per-abi

      # 6. 编译 App Bundle (可选)
      - name: 编译 App Bundle
        run: |
          flutter build appbundle --release

      # 7. 打包 Release
      - name: 打包 Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.release_version }}
          name: "Release v${{ github.event.inputs.release_version }}"
          body: |
            ## 📝 更新内容
            ${{ github.event.inputs.release_notes }}
            
            ---
            📱 **Android APK**
            - `armeabi-v7a`：32位 ARM 设备
            - `arm64-v8a`：64位 ARM 设备（推荐）
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8. 上传 APK 到 Actions Artifacts
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: NoteX-APK-v${{ github.event.inputs.release_version }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      # 9. 上传 App Bundle
      - name: 上传 App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: NoteX-AAB-v${{ github.event.inputs.release_version }}
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30
